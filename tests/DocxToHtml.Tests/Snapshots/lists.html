<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lists</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <ul>
      <li>Fruit<ul>
          <li>Apple</li>
          <li>Pear</li>
        </ul>
      </li>
      <li>Vegetable</li>
    </ul>
    <p>Between the lists.</p>
    <ol>
      <li>First</li>
      <li>Second<ol class="lower-alpha">
          <li>Letter</li>
        </ol>
      </li>
    </ol>
    <ol start="5">
      <li>Fifth</li>
    </ol>
  </body>
</html>
