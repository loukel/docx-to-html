<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run formatting</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<p>Plain words</p>
<p><strong>Bold words</strong></p>
<p><em>Italic words</em></p>
<p><u>Underlined words</u></p>
<p><s>Struck words</s></p>
<p><sup>Superscript</sup></p>
<p><sub>Subscript</sub></p>
<p><span class="color-ff0000">Red words</span></p>
<p><span class="highlight-ffff00">Highlighted words</span></p>
<p><span class="size-14pt">Bigger words</span></p>
<p class="align-center">Centered words</p>
</body>
</html>
