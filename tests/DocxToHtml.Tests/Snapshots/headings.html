<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Headings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1 class="p-heading-1">Chapter</h1>
    <h2 class="p-heading-2">Section</h2>
    <h3 class="p-heading-3">Topic</h3>
    <h4 class="p-heading-4">Detail</h4>
    <h5 class="p-heading-5">Note</h5>
    <h6 class="p-heading-6">Aside</h6>
    <h6 class="p-heading-7 h7">Deep</h6>
    <h6 class="p-heading-8 h8">Deeper</h6>
    <h6 class="p-heading-9 h9">Deepest</h6>
    <h1 class="title">Document title</h1>
    <p class="subtitle">A subtitle</p>
    <h2 class="p-appendix-heading">Appendix</h2>
    <h6 class="p-deep-custom h7">Buried</h6>
    <h1>Outlined</h1>
    <p>Body text</p>
  </body>
</html>
